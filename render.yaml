services:
  - type: web
    name: music-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: PO_TOKEN
        sync: false
      - key: VISITOR_DATA
        sync: false
